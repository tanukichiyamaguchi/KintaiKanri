name: Deploy GAS (Apps Script)

# gas/ 以下が変わった push でだけ自動デプロイする。
# 安全のため本番運用ブランチのみを対象にする（フィーチャーブランチで誤って本番GASを
# 書き換えないように）。手動実行も可能。
on:
  push:
    branches:
      - main
      - claude/attendance-tracking-app-PquFH
    paths:
      - 'gas/**'
      - '.clasp.json'
      - '.claspignore'
      - '.github/workflows/deploy-gas.yml'
  workflow_dispatch:
    inputs:
      skip_deploy:
        description: 'true なら clasp push のみで deploy をスキップ（メニュー関数の更新のみ）'
        required: false
        default: 'false'

# 同時実行を1つに絞る（複数 push が連続したとき、最後のものだけが残るように）
concurrency:
  group: 'gas-deploy'
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install clasp
        run: npm install -g @google/clasp@2.4.2

      - name: Write clasp credentials from secret
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          if [ -z "$CLASPRC_JSON" ]; then
            echo "::error::Secret CLASPRC_JSON is not set. See docs/GAS_DEPLOYMENT.md for setup."
            exit 1
          fi
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          chmod 600 "$HOME/.clasprc.json"
          echo "Wrote ~/.clasprc.json ($(wc -c < $HOME/.clasprc.json) bytes)"

      - name: Verify clasp can see the project
        run: |
          clasp --version
          clasp status || (echo "::error::clasp status failed. Credentials may be invalid or expired. Re-run 'clasp login' locally and update CLASPRC_JSON secret."; exit 1)

      - name: Push source to Apps Script
        run: clasp push --force

      - name: Redeploy all versioned web app deployments (URLs preserved)
        if: ${{ github.event.inputs.skip_deploy != 'true' }}
        run: |
          DESC="auto-deploy: ${GITHUB_SHA::7} (${GITHUB_REF_NAME})"
          # @HEAD は常に最新コードを配信するので除外し、@<番号> の
          # versioned デプロイのみ既存IDのまま再デプロイする（URL は不変）。
          # フロントがどのデプロイURLを使っていても確実に更新されるよう全件対象にする。
          IDS=$(clasp deployments | awk '/^- AKfycb/ && $3 ~ /^@[0-9]/ {print $2}')
          if [ -z "$IDS" ]; then
            echo "::warning::versioned なウェブアプリのデプロイが見つかりませんでした。clasp push のみ実施済み（@HEAD 配信は最新化）。"
            exit 0
          fi
          FAIL=0
          for DID in $IDS; do
            echo "--- Deploying $DID ---"
            if clasp deploy --deploymentId "$DID" --description "$DESC"; then
              echo "OK: $DID"
            else
              echo "::error::deploy failed for $DID"
              FAIL=1
            fi
          done
          exit $FAIL

      - name: Summary
        if: always()
        run: |
          echo "### GAS Deploy Summary" >> $GITHUB_STEP_SUMMARY
          echo "- Commit: \`${GITHUB_SHA::7}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Branch: \`${GITHUB_REF_NAME}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Trigger: \`${{ github.event_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- 方式: clasp push + 全 versioned デプロイを再デプロイ（URL 維持）" >> $GITHUB_STEP_SUMMARY
